version: '3.8'

services:
  # --- PostgreSQL Databases ---
  postgres_auth:
    image: postgres:16-alpine
    container_name: postgres_auth_db
    environment:
      POSTGRES_USER: user_auth
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  postgres_order:
    image: postgres:16-alpine
    container_name: postgres_order_db
    environment:
      POSTGRES_USER: user_order
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: order_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data

  postgres_product:
    image: postgres:16-alpine
    container_name: postgres_product_db
    environment:
      POSTGRES_USER: user_product
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: product_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_product_data:/var/lib/postgresql/data

  postgres_payment:
    image: postgres:16-alpine
    container_name: postgres_payment_db
    environment:
      POSTGRES_USER: user_payment
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: payment_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data

  # --- Other Infrastructure ---
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_broker
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: elasticsearch_engine
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
    ports:
      - "9200:9200"

  mongodb:
    image: mongo:7.0
    container_name: notification
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: noti
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_auth_data:
  postgres_order_data:
  postgres_product_data:
  postgres_payment_data:
  redis_data:
  mongo_data: